<!doctype html><html lang="ja"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="globals.css"/><link rel="stylesheet" href="_frame.css"/>
</head><body>
<header class="site-header"><div class="inner">
  <a class="brand"><span class="seal">旅</span>旅のしおり</a>
  <nav><a>つくる</a><a>履歴</a></nav>
</div></header>
<main><div class="page">

  <div class="panel-navy">
    <span class="stamp-title">旅のしおり</span>
    <h1 style="margin-top:14px">行きたい場所から、旅の一日をくみ立てる</h1>
    <p style="margin-bottom:0;opacity:.9">日程と行きたいスポットを入力すると、AI が旅程を5案提案します。選んで手直しし、しおりに仕上げましょう。</p>
  </div>

  <div class="card mt-lg">
    <div class="field">
      <label>目的地（都道府県・市区町村・エリア名）</label>
      <div class="chips" style="margin-bottom:8px">
        <span class="chip">京都市 <button>×</button></span>
      </div>
      <div class="inline">
        <input type="text" placeholder="例：京都市 と入力して「＋ 追加」"/>
        <button class="btn btn-ghost" style="white-space:nowrap">＋ 追加</button>
      </div>
      <p class="muted" style="margin-top:4px">複数の地域を追加できます。</p>
    </div>

    <div class="field">
      <label>日程</label>
      <div class="row">
        <input type="date" value="2026-11-21"/>
        <input type="date" value="2026-11-22"/>
      </div>
      <p class="muted" style="margin-top:6px">2026年11月21日(土) 〜 2026年11月22日(日)（1泊2日）</p>
    </div>

    <div class="field">
      <label>初日の到着予定</label>
      <div class="stack"><div class="chips">
        <button class="btn btn-sm btn-ghost">午前</button>
        <button class="btn btn-sm btn-primary">午後</button>
        <button class="btn btn-sm btn-ghost">夜</button>
        <button class="btn btn-sm btn-ghost">時刻を指定</button>
      </div></div>
      <p class="muted" style="margin-top:4px">この時刻より前には初日のスポットを入れません。</p>
    </div>

    <div class="field">
      <label>人数</label>
      <div class="row">
        <div><span class="muted">大人</span><input type="text" inputmode="numeric" value="2"/></div>
        <div><span class="muted">子ども</span><input type="text" inputmode="numeric" value="1"/></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div style="flex:0 0 120px"><span class="muted">1人目の年齢</span><input type="text" inputmode="numeric" value="6"/></div>
      </div>
    </div>

    <div class="field">
      <label>行きたい場所・お店（任意）</label>
      <div class="chips" style="margin-bottom:8px">
        <span class="chip">清水寺 <button>×</button></span>
        <span class="chip">伏見稲荷大社 <button>×</button></span>
      </div>
      <div class="inline">
        <input type="text" placeholder="場所やお店の名前を入力して「＋ 追加」"/>
        <button class="btn btn-ghost" style="white-space:nowrap">＋ 追加</button>
      </div>
    </div>

    <button class="btn btn-primary mt">プランを5案もらう</button>
  </div>

</div></main>
</body></html>
